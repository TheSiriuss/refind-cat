# rEFInd "Night Meadow Cat" theme  -  https://github.com/TheSiriuss/refind-cat
# Pulled into refind.conf with:  include themes/cat/theme.conf   (paths below are relative to the rEFInd directory)

banner themes/cat/bg.png
banner_scale fillscreen
icons_dir themes/cat/icons
font themes/cat/font.png
selection_big themes/cat/selection_big.png
selection_small themes/cat/selection_small.png
big_icon_size 256
small_icon_size 48
hideui hints,badges

# Only power / reboot / firmware tools.  rEFInd 0.14 does not clear the unused slots of this list, so they are
# filled with a tool that is a no-op on anything but a Mac (otherwise the default tools reappear after these).
showtools shutdown, reboot, firmware, csr_rotate, csr_rotate, csr_rotate, csr_rotate, csr_rotate, csr_rotate, csr_rotate, csr_rotate
